name: Flake check
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      classes:
        description: Space-separated fully qualified test class names
        required: false
        type: string
        default: ""
      runs:
        description: Times to run the selected tests
        required: false
        type: number
        default: 30
permissions: {}
concurrency:
  group: flake-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  flake-check:
    name: Rerun changed tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve test classes
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CLASSES: ${{ github.event.inputs.classes }}
        run: |
          set -euo pipefail
          classes_file="${RUNNER_TEMP}/flake-classes.txt"
          : >"$classes_file"
          classes=()

          add_class() {
            local class="$1"
            if [[ ! "$class" =~ ^[A-Za-z0-9_.]+$ ]]; then
              printf 'Invalid test class name\n' >&2
              exit 1
            fi
            classes+=("$class")
          }

          classes_from_file() {
            local file="$1"
            local pkg simple fqcn
            local -a simples
            if [[ ! -f "$file" ]]; then
              printf 'Changed test file is missing: %s\n' "$file" >&2
              exit 1
            fi
            pkg="$(grep -E '^package [A-Za-z0-9_.]+' -- "$file" | sed -n 's/^package \([A-Za-z0-9_.][A-Za-z0-9_.]*\).*/\1/p' | head -n 1 || true)"
            if [[ -z "$pkg" ]]; then
              printf 'No package line in %s\n' "$file" >&2
              exit 1
            fi
            if [[ ! "$pkg" =~ ^[A-Za-z0-9_.]+$ ]]; then
              printf 'Invalid package name parsed from %s\n' "$file" >&2
              exit 1
            fi
            mapfile -t simples < <(grep -E '^(internal )?class [A-Za-z_][A-Za-z0-9_]*' -- "$file" | grep -Ev '(^|[[:space:]])(private|abstract|open|data|sealed|enum|inner|object)[[:space:]]' | sed -E 's/^(internal )?class ([A-Za-z_][A-Za-z0-9_]*).*/\2/' || true)
            if [[ ${#simples[@]} -eq 0 ]]; then
              printf 'No top-level class names in %s\n' "$file" >&2
              exit 1
            fi
            for simple in "${simples[@]}"; do
              [[ -n "$simple" ]] || continue
              if [[ ! "$simple" =~ ^[A-Za-z0-9_]+$ ]]; then
                printf 'Invalid class name parsed from %s\n' "$file" >&2
                exit 1
              fi
              fqcn="${pkg}.${simple}"
              add_class "$fqcn"
            done
          }

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ -n "${DISPATCH_CLASSES// }" ]]; then
              local_normalized="${DISPATCH_CLASSES//,/ }"
              read -r -a raw <<<"$local_normalized"
              for class in "${raw[@]}"; do
                [[ -n "$class" ]] || continue
                add_class "$class"
              done
            fi
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
              echo "Expected a pull_request merge commit with two parents" >&2
              exit 1
            fi
            while IFS= read -r -d '' file; do
              [[ "$file" == *Test.kt ]] || continue
              classes_from_file "$file"
            done < <(git diff -z --name-only --diff-filter=ACMR HEAD^1...HEAD^2 -- app/src/test)
          else
            echo "Unsupported event" >&2
            exit 1
          fi

          if [[ ${#classes[@]} -eq 0 ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            {
              echo "No changed unit test classes under \`app/src/test\`; skipping."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "No changed unit test classes under app/src/test; skipping."
            exit 0
          fi

          printf '%s\n' "${classes[@]}" | sort -u >"$classes_file"
          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "Selected test classes:"
          cat "$classes_file"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.resolve.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.resolve.outputs.skip != 'true'
        with:
          cache-read-only: true

      - name: Rerun selected tests
        id: rerun
        if: steps.resolve.outputs.skip != 'true'
        env:
          RUN_COUNT: ${{ github.event.inputs.runs || 30 }}
        run: |
          set -euo pipefail
          classes_file="${RUNNER_TEMP}/flake-classes.txt"
          failed_methods_file="${RUNNER_TEMP}/flake-failed-methods.txt"
          : >"$failed_methods_file"
          mapfile -t raw_classes <"$classes_file"
          classes=()
          for class in "${raw_classes[@]}"; do
            [[ -n "$class" ]] || continue
            if [[ ! "$class" =~ ^[A-Za-z0-9_.]+$ ]]; then
              echo "Invalid test class name" >&2
              exit 1
            fi
            classes+=("$class")
          done
          if [[ ${#classes[@]} -eq 0 ]]; then
            echo "No test classes to run" >&2
            exit 1
          fi

          if [[ ! "$RUN_COUNT" =~ ^[1-9][0-9]*$ ]] || ((RUN_COUNT > 100)); then
            echo "runs must be an integer from 1 to 100" >&2
            exit 1
          fi

          test_args=()
          for class in "${classes[@]}"; do
            test_args+=(--tests "$class")
          done

          declare -A pass_count fail_count
          for class in "${classes[@]}"; do
            pass_count["$class"]=0
            fail_count["$class"]=0
          done

          failed_root="${RUNNER_TEMP}/flake-failed"
          mkdir -p "$failed_root"
          any_fail=0

          for ((i = 1; i <= RUN_COUNT; i++)); do
            echo "::group::Flake run ${i}/${RUN_COUNT}"
            rm -rf app/build/test-results app/build/reports/tests
            set +e
            ./gradlew :app:testDebugUnitTest "${test_args[@]}" --rerun --stacktrace
            status=$?
            set -e
            echo "::endgroup::"

            if [[ "$status" -ne 0 ]]; then
              any_fail=1
              dest="${failed_root}/run-${i}"
              mkdir -p "$dest"
              if [[ -d app/build/test-results ]]; then
                cp -a app/build/test-results "$dest/"
              fi
              if [[ -d app/build/reports/tests ]]; then
                cp -a app/build/reports/tests "$dest/"
              fi
            fi

            for class in "${classes[@]}"; do
              xml="app/build/test-results/testDebugUnitTest/TEST-${class}.xml"
              class_passed=0
              if [[ -f "$xml" ]]; then
                mapfile -t xml_info < <(python3 -c 'import sys, xml.etree.ElementTree as ET; r = ET.parse(sys.argv[1]).getroot(); print("1" if int(r.attrib.get("failures", "0")) == 0 and int(r.attrib.get("errors", "0")) == 0 else "0"); names = [tc.get("name") or "" for tc in r.iter("testcase") if tc.find("failure") is not None or tc.find("error") is not None]; print("\n".join(names), end="")' "$xml")
                if [[ "${xml_info[0]:-0}" == 1 ]]; then
                  class_passed=1
                else
                  for method in "${xml_info[@]:1}"; do
                    [[ -n "$method" ]] || continue
                    printf '%s\t%s\n' "$class" "$method" >>"$failed_methods_file"
                  done
                fi
              fi
              if [[ "$class_passed" -eq 1 ]]; then
                pass_count["$class"]=$((pass_count["$class"] + 1))
              else
                fail_count["$class"]=$((fail_count["$class"] + 1))
              fi
            done
          done

          {
            echo "## Flake check"
            echo
            echo "Runs: ${RUN_COUNT}"
            echo
            echo "| Class | Pass | Fail |"
            echo "| --- | ---: | ---: |"
            for class in "${classes[@]}"; do
              printf '| %s | %s | %s |\n' "$class" "${pass_count[$class]}" "${fail_count[$class]}"
            done
            if [[ -s "$failed_methods_file" ]]; then
              echo
              echo "### Failed tests"
              sort -u "$failed_methods_file" | while IFS=$'\t' read -r cls meth; do
                printf -- '- %s.%s\n' "$cls" "$meth"
              done
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ "$any_fail" -ne 0 ]]; then
            echo "One or more flake-check runs failed" >&2
            exit 1
          fi

      - name: Upload failing run reports
        if: failure() && steps.rerun.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-check-reports
          path: ${{ runner.temp }}/flake-failed/
          if-no-files-found: ignore
          retention-days: 14
