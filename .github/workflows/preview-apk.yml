name: Preview APK

on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 defaulted to the removed legacy `tools` package.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Run tests
        run: ./gradlew test

      - name: Decode preview keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/backpin-preview.jks"

      - name: Build preview APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/backpin-preview.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assemblePreview

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="app/build/outputs/apk/preview/app-preview.apk"
          test -f "$apk"
          cp "$apk" backpin.apk
          if gh release view preview >/dev/null 2>&1; then
            gh release delete preview --yes --cleanup-tag
          fi
          gh release create preview backpin.apk \
            --target "$GITHUB_SHA" \
            --title preview \
            --notes "Latest Backpin preview."
