name: Preview APK

# Push to staging is the normal publish. A manual run builds the staging tip.
# The release dispatch workflow starts that manual run when a promotion's push
# event never arrives. This file does not use workflow_run: that trigger is
# privileged, and building a checked-out ref here would execute untrusted code
# with the preview signing secrets.
on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-apk
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.push.outputs.build || steps.manual.outputs.build }}
    steps:
      - name: Publish a staging push
        id: push
        if: github.event_name == 'push'
        run: echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Skip a manual run that is already published
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/staging" --jq .sha)
          published=$(gh release view preview --json targetCommitish --jq .targetCommitish || true)
          if [ -n "$published" ]; then
            resolved=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${published}" --jq .sha || true)
            if [ -n "$resolved" ]; then
              published=$resolved
            fi
          fi
          if [ "$tip" = "$published" ]; then
            echo "Staging ${tip} is already the preview release."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  preview:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pushed commit
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout staging
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 defaulted to the removed legacy `tools` package.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Run tests
        run: ./gradlew test

      - name: Decode preview keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/backpin-preview.jks"

      - name: Build preview APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/backpin-preview.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assemblePreview

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="app/build/outputs/apk/preview/app-preview.apk"
          test -f "$apk"
          cp "$apk" backpin.apk
          sha=$(git rev-parse HEAD)
          if gh release view preview >/dev/null 2>&1; then
            gh release delete preview --yes --cleanup-tag
          fi
          gh release create preview backpin.apk \
            --target "$sha" \
            --title preview \
            --notes "Latest Backpin preview."
