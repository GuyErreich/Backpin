name: Promote dev to staging

on:
  push:
    branches:
      - dev

concurrency:
  group: promote-dev-to-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Require GitHub App credentials
        env:
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$GH_APP_CLIENT_ID" ] || [ -z "$GH_APP_PRIVATE_KEY" ]; then
            echo "GH_APP_CLIENT_ID and GH_APP_PRIVATE_KEY are required."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fast-forward staging
        run: |
          git fetch origin staging
          if git merge-base --is-ancestor origin/staging HEAD; then
            git push origin HEAD:staging
          else
            echo "staging has commits that are not on dev. Refusing to overwrite it."
            exit 1
          fi
